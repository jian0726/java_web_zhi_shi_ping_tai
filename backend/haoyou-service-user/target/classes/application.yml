server:
  port: 59851

spring:
  application:
    name: haoyou-service-user
  datasource:
    url: jdbc:mysql://localhost:3306/haoyou?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted

haoyou:
  file:
    storage: local
    local-path: ./data/upload
  jwt:
    # HS256 密钥须 >= 32 字节；生产环境改走配置中心/环境变量
    secret: haoyou-jwt-secret-key-2026-please-change-me-32bytes
    expire-hours: 24
