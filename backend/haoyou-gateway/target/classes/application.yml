server:
  port: 8080

spring:
  application:
    name: haoyou-gateway
  cloud:
    gateway:
      routes:
        - id: user
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        - id: creator
          uri: http://localhost:8082
          predicates:
            - Path=/api/creator/**
        - id: kb
          uri: http://localhost:8083
          predicates:
            - Path=/api/kb/**
        - id: audit
          uri: http://localhost:8084
          predicates:
            - Path=/api/audit/**
        - id: job
          uri: http://localhost:8085
          predicates:
            - Path=/api/job/**
        - id: search
          uri: http://localhost:8086
          predicates:
            - Path=/api/search/**
        - id: notify
          uri: http://localhost:8087
          predicates:
            - Path=/api/notify/**
        - id: file
          uri: http://localhost:8088
          predicates:
            - Path=/api/file/**
