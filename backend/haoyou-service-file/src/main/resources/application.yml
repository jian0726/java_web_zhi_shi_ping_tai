server:
  port: 8088

spring:
  application:
    name: haoyou-service-file
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:./data/upload/

haoyou:
  file:
    storage: local
    local-path: ./data/upload
