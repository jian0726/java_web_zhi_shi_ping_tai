stages:
  - build
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd zhi_shi_ku
    - mvn -B -s ../ci-settings.xml clean compile
  # 依赖缓存，下次构建不用重新下载
  cache:
    key: maven-repo
    paths:
      - .m2/repository

package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd zhi_shi_ku
    - mvn -B -s ../ci-settings.xml package -DskipTests
  # 构建出的 jar 保存 1 周，可在流水线页面下载
  artifacts:
    paths:
      - zhi_shi_ku/target/*.jar
    expire_in: 1 week
  cache:
    key: maven-repo
    paths:
      - .m2/repository
