# Java CI with Maven
# 触发条件：push 或 PR 到 main 分支
name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Maven 项目位于仓库子目录 zhi_shi_ku，后续所有命令都在该目录执行
    defaults:
      run:
        working-directory: zhi_shi_ku

    steps:
      - uses: actions/checkout@v4

      # 项目 pom.xml 编译目标为 Java 21，必须使用 JDK 21（模板默认 17 会编译失败）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 可选：上传构建产物，便于在 Actions 页面直接下载 jar 包
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhi-shi-ku-jar
          path: zhi_shi_ku/target/*.jar
